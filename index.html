<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursk State University - Estudiar en Rusia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
      /* --- ПЕРЕМЕННЫЕ И СТИЛИ ДЛЯ СХОДСТВА С МАКЕТОМ --- */
      :root {
        --blue-dark: #003366;
        --blue-light: #0056b3;
        --blue-sky: #e6f0fa;
        --gold: #ffcc00;
        --gold-dark: #e6b800;
        --text-color: #333333;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        color: var(--text-color);
        line-height: 1.5;
        background-color: #f8f9fa;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* --- ШАПКА САЙТА (HEADER) --- */
      .header {
        background-color: var(--blue-dark);
        color: var(--white);
        padding: 15px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 2px solid var(--gold);
      }

      .header__inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-block {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-img {
        width: 50px;
        height: auto;
        filter: brightness(0) invert(1); /* Делаем иконку белой */
      }

      .logo-text {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .navigation {
        display: flex;
        gap: 20px;
      }

      .navigation a {
        color: var(--white);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: color 0.3s;
      }

      .navigation a:hover {
        color: var(--gold);
      }

      .lang-switch {
        background-color: #d9381e;
        color: var(--white);
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      /* --- ГЛАВНЫЙ ЭКРАН (HERO) --- */
      .hero {
        background: linear-gradient(135deg, rgba(0,51,102,0.9) 0%, rgba(0,86,179,0.85) 100%), 
                    url('https://unsplash.com') no-repeat center center/cover;
        color: var(--white);
        padding: 80px 0;
        position: relative;
        overflow: hidden;
      }

      .hero__grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
      }

      .handwritten {
        font-family: 'Caveat', cursive;
        color: var(--gold);
        font-size: 32px;
        transform: rotate(-3deg);
        display: inline-block;
        margin-bottom: 10px;
      }

      .hero h1 {
        font-size: 46px;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 20px;
      }

      .hero__text {
        font-size: 16px;
        margin-bottom: 30px;
        opacity: 0.9;
      }

      .btn-video {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background-color: var(--gold);
        color: var(--blue-dark);
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 14px;
        transition: transform 0.3s, background-color 0.3s;
        box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
      }

      .btn-video:hover {
        background-color: var(--white);
        transform: translateY(-2px);
      }

      .btn-video::before {
        content: '▶';
        font-size: 12px;
      }

      .hero__img-wrapper {
        position: relative;
      }

      .hero__img {
        width: 100%;
        border-radius: 20px;
        border: 4px solid var(--white);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }

      /* --- БЛОК ОПЫТА (EXPERIENCE) --- */
      .experience {
        padding: 6px 0;
        background-color: var(--white);
      }

      .exp-grid {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 40px;
        align-items: center;
        background: var(--white);
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        padding: 30px;
      }

      .exp-video-box {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
      }

      .exp-video-box img {
        width: 100%;
        display: block;
      }

      .play-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.9);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--blue-dark);
        cursor: pointer;
      }

      .exp-content h2 {
        color: var(--blue-dark);
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 15px;
      }

      .exp-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 25px;
      }

      .exp-card {
        background: var(--blue-sky);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--blue-dark);
      }

      /* --- РАЗДЕЛ С КАРТОЧКАМИ НАПРАВЛЕНИЙ (WHAT TO STUDY) --- */
      .programs-section {
        padding: 60px 0;
      }

      .section-title {
        text-align: center;
        margin-bottom: 40px;
      }

      .section-title h2 {
        color: var(--blue-dark);
        font-size: 36px;
        font-weight: 800;
      }

      .section-title p {
        color: var(--blue-light);
        font-size: 16px;
        margin-top: 5px;
      }

      .programs-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }

      .prog-card {
        background: var(--white);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        transition: transform 0.3s;
        display: flex;
        flex-direction: column;
      }

      .prog-card:hover {
        transform: translateY(-5px);
      }

      .prog-img {
        height: 150px;
        width: 100%;
        object-fit: cover;
      }

      .prog-body {
        padding: 20px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .prog-body h3 {
        font-size: 15px;
        color: var(--blue-dark);
        text-transform: uppercase;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .prog-list {
        font-size: 12px;
        color: #666;
        list-style: none;
        margin-bottom: 15px;
      }

      .prog-list li {
        margin-bottom: 4px;
      }

      .prog-arrow {
        align-self: flex-end;
        width: 30px;
        height: 30px;
        background: var(--blue-sky);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--blue-dark);
        text-decoration: none;
        font-weight: bold;
      }

      /* Адаптивность для мобильных телефонов */
      @media (max-width: 992px) {
        .programs-grid { grid-template-columns: repeat(2, 1fr); }
        .hero__grid { grid-template-columns: 1fr; }
        .exp-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 576px) {
        .programs-grid { grid-template-columns: 1fr; }
        .navigation { display: none; }
      }
    </style>
  </head>

  <body>
    <!-- НАВИГАЦИЯ ИЗ МАКЕТА -->
    <header class="header">
      <div class="container header__inner">
        <div class="logo-block">
          <img class="logo-img" src="https://icons8.com" alt="KSU Logo" />
          <div class="logo-text">Kursk State<br />University</div>
        </div>

        <nav class="navigation">
          <a href="#">Inicio</a>
          <a href="#">Sobre KSU</a>
          <a href="#">Programas de estudio</a>
          <a href="#">Admisión</a>
          <a href="#">Vida en el campus</a>
          <a href="#">Contacto</a>
        </nav>

        <div class="lang-switch">
          <span>🇪🇸 Español</span>
        </div>
      </div>
    </header>

    <main>
      <!-- ПЕРВЫЙ ГЛАВНЫЙ ЭКРАН -->
      <section class="hero">
        <div class="container hero__grid">
          <div>
            <span class="handwritten">Desde Perú hasta Kursk ♥</span>
            <h1>Descubre KSU.<br />Descubre tu futuro.</h1>
            <p class="hero__text">
              Una universidad con tradición, oportunidades internacionales y una comunidad que te apoya en cada paso de tu camino.
            </p>
            <a class="btn-video" href="#">Ver el video</a>
          </div>
          <div class="hero__img-wrapper">
            <!-- Временное качественное фото улыбающихся студентов для сочности макета -->
            <img class="hero__img" src="https://unsplash.com" alt="Estudiantes de KSU" />
          </div>
        </div>
      </section>

      <!-- ВТОРОЙ БЛОК: ОПЫТ, МЕНЯЮЩИЙ ЖИЗНЬ -->
      <section class="experience">
        <div class="container">
